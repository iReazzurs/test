<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тестовое задание</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
      <div class="card-img">
          <img src="tea.jpg" alt="img">
      </div>

      <div class="card-info">
          <h2>Ананасовый улун</h2>
          <div class="all-btn">
              <button class="weight-btn active"     data-sku="01306" data-old-price="349,20"  data-price="326,40">100 г</button>
              <button class="weight-btn non-active" data-sku="01307" data-old-price="1 646"   data-price="1 432">500 г</button>
              <button class="weight-btn non-active" data-sku="01308" data-old-price="2 592"   data-price="2 064">1000 г</button>
              <button class="weight-btn non-active" data-sku="01309" data-old-price="8 710"   data-price="6 320">5000 г</button>
          </div>
          
          <p class="SKU">арт: <span>01306</span></p>

          <button class="basket">
              <span class="old-price">349,20 ₽</span>
              <span class="new-price">326,40 ₽</span>
          </button>
      </div>
  </div>  

  <script src="script.js"></script>
</body>
</html>
